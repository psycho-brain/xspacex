<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クジ引きアプリ</title>
    <style id="custom-theme-styles">
        /* デフォルトデザイン */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --btn-color: #ff4757;
            --bg-image: none;
        }
        body {
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
    </style>
    <style id="admin-custom-css">
        /* 管理画面から追加できるカスタムCSS用領域 */
    </style>
    <style>
        /* アプリ共通基本スタイル */
        .header-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .nav-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        .container {
            max-width: 600px;
            width: 90%;
            margin: 80px auto 40px auto;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1#app-title {
            margin-top: 0;
            font-size: 28px;
        }
        p#app-desc {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        /* クジ引きボタン（CSS制御のシンプルデザイン） */
        .draw-btn-container {
            margin: 30px 0;
        }
        .kuji-draw-button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.2s;
            width: 80%;
            max-width: 300px;
        }
        .kuji-draw-button:active {
            transform: scale(0.97);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .kuji-draw-button:disabled {
            background-color: #cccccc !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .history-trigger-container {
            margin-top: 30px;
        }
        .secondary-btn {
            background: none;
            border: 2px solid var(--btn-color);
            color: var(--btn-color);
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .secondary-btn:hover {
            background: var(--btn-color);
            color: white;
        }
        /* モーダル共通スタイル */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            text-align: left;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        /* 当選画面スタイル */
        .win-view {
            text-align: center;
        }
        .win-comment {
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 20px;
        }
        .win-name {
            font-size: 24px;
            margin: 15px 0;
            font-weight: bold;
        }
        .win-img-box img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .save-notice {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        /* 管理画面スタイル */
        .admin-login-box {
            text-align: center;
            padding: 20px 0;
        }
        .admin-tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #f1f1f1;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: white;
            border-bottom: 2px solid #333;
            margin-bottom: -2px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .item-list-admin {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .item-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            background: #eee;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-danger {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .btn-primary {
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 15px;
            cursor: pointer;
        }
        /* 履歴一覧スタイル */
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .history-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background: #f0f0f0;
        }
        .history-info {
            flex: 1;
        }
        .history-name {
            font-weight: bold;
            font-size: 16px;
        }
        .history-time {
            font-size: 12px;
            color: #888;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- 右上アクションボタン群 -->
    <div class="header-actions">
        <button class="nav-btn" id="refresh-view-btn" onclick="location.reload();">更新（同期）</button>
        <button class="nav-btn" onclick="openAdminModal()">管理画面</button>
    </div>

    <!-- メインコンテンツ -->
    <div class="container">
        <h1 id="app-title">豪華クジ引き大会</h1>
        <p id="app-desc">ボタンを押してクジを引こう！何が当たるかはお楽しみ。1日3回までチャレンジできます。</p>

        <div class="draw-btn-container">
            <button class="kuji-draw-button" id="draw-button" onclick="executeDraw()">クジを引く</button>
            <div id="draw-count-status" style="margin-top: 10px; font-size: 14px; color: #666;"></div>
        </div>

        <div class="history-trigger-container">
            <button class="secondary-btn" onclick="openHistoryModal()">当選履歴を見る</button>
        </div>
    </div>

    <!-- 1. 当選画面モーダル -->
    <div id="win-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <span class="modal-close" onclick="closeModal('win-modal')">&times;</span>
            <div class="win-view">
                <div class="win-comment" id="modal-win-comment">おめでとうございます！</div>
                <div class="win-img-box">
                    <img id="modal-win-img" src="" alt="当選アイテム画像">
                </div>
                <div class="win-name" id="modal-win-name">アイテム名</div>
                <p class="save-notice">※画像を長押し、または右クリックで保存できます</p>
            </div>
        </div>
    </div>

    <!-- 2. 当選履歴モーダル -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('history-modal')">&times;</span>
            <h3>当選履歴一覧</h3>
            <div id="history-empty" style="color:#999; text-align:center; padding: 20px; display:none;">
                まだ当選履歴はありません。
            </div>
            <ul class="history-list" id="history-list-container">
                <!-- JavaScriptで挿入 -->
            </ul>
        </div>
    </div>

    <!-- 3. 管理画面モーダル -->
    <div id="admin-modal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="modal-close" onclick="closeModal('admin-modal')">&times;</span>
            <h3>管理画面</h3>
            
            <!-- ログインフォーム -->
            <div id="admin-login-area" class="admin-login-box">
                <p style="font-size:14px; color:#555;">パスワードを入力してください（管理人2名共通）</p>
                <div class="form-group" style="max-width:300px; margin: 0 auto 15px auto;">
                    <input type="password" id="admin-password-input" placeholder="パスワードを入力">
                </div>
                <button class="btn-primary" onclick="checkAdminPassword()">ログイン</button>
                <div id="login-error" style="color:red; font-size:12px; margin-top:10px;"></div>
            </div>

            <!-- 管理操作コンテンツ -->
            <div id="admin-main-area" style="display: none;">
                <!-- 管理者判別情報等の表示用 -->
                <div style="background:#f9f9f9; padding:8px 12px; border-radius:4px; margin-bottom:15px; font-size:13px; display:flex; justify-content:space-between; align-items:center;">
                    <span>ステータス: <strong>管理人ログイン中</strong></span>
                    <button class="btn-sm" onclick="adminLogout()" style="background:#999; color:white; border:none; border-radius:3px; cursor:pointer;">ログアウト</button>
                </div>

                <div class="admin-tabs">
                    <button class="tab-btn active" onclick="switchAdminTab('tab-items')">アイテム管理</button>
                    <button class="tab-btn" onclick="switchAdminTab('tab-settings')">制限・セリフ</button>
                    <button class="tab-btn" onclick="switchAdminTab('tab-design')">デザイン設定</button>
                </div>

                <!-- タブ1: アイテム管理 -->
                <div id="tab-items" class="tab-content active">
                    <h4>新しいアイテムの追加</h4>
                    <div class="form-group">
                        <label>アイテム名称</label>
                        <input type="text" id="new-item-name" placeholder="例: 特賞 A商品">
                    </div>
                    <div class="form-group">
                        <label>個数 (1〜100)</label>
                        <input type="number" id="new-item-count" min="1" max="100" value="10">
                    </div>
                    <div class="form-group">
                        <label>アイテム画像</label>
                        <input type="file" id="new-item-file" accept="image/*">
                    </div>
                    <button class="btn-primary" onclick="addNewItem()">アイテムを追加</button>

                    <h4 style="margin-top:25px;">登録中のアイテム一覧</h4>
                    <div class="item-list-admin" id="admin-items-container">
                        <!-- JavaScriptで動的生成 -->
                    </div>
                </div>

                <!-- タブ2: 制限・セリフ設定 -->
                <div id="tab-settings" class="tab-content">
                    <div class="form-group">
                        <label>1日にクジ引きできる回数上限</label>
                        <input type="number" id="setting-max-draws" min="1" value="3">
                    </div>
                    <div class="form-group">
                        <label>当選時のセリフ（一律共通）</label>
                        <input type="text" id="setting-win-comment" value="おめでとうございます！大当りです！">
                    </div>
                    <button class="btn-primary" onclick="saveSettings()">設定を保存</button>
                    
                    <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
                    <h4>回数の手動リセット</h4>
                    <p style="font-size:12px; color:#666;">※通常は毎日深夜0時に自動でリセットされますが、今すぐ全員分の本日プレイ回数をリセット（全回復）できます。</p>
                    <button class="btn-danger" style="padding:8px 15px; font-weight:bold; cursor:pointer;" onclick="resetAllUsersDrawCount()">今すぐ本日のプレイ回数をリセット</button>
                </div>

                <!-- タブ3: デザイン設定 -->
                <div id="tab-design" class="tab-content">
                    <div class="form-group">
                        <label>タイトル文字列</label>
                        <input type="text" id="design-title-text">
                    </div>
                    <div class="form-group">
                        <label>説明文テキスト</label>
                        <textarea id="design-desc-text" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>背景色</label>
                        <input type="color" id="design-bg-color">
                    </div>
                    <div class="form-group">
                        <label>文字色（全体）</label>
                        <input type="color" id="design-text-color">
                    </div>
                    <div class="form-group">
                        <label>クジ引きボタンの色</label>
                        <input type="color" id="design-btn-color">
                    </div>
                    <div class="form-group">
                        <label>背景画像URL（任意）</label>
                        <input type="text" id="design-bg-image-url" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>追加カスタムCSS（上級者向け）</label>
                        <textarea id="design-custom-css" rows="4" placeholder=".kuji-draw-button { border: 3px solid gold; }"></textarea>
                    </div>
                    <button class="btn-primary" onclick="saveDesignSettings()">デザインを保存・適用</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- コードから直接アイテムを複数追加・初期設定できる配列 ---
        // まだブラウザの保存データがない初期状態のときのみ、これが自動的に読み込まれます。
        const INITIAL_ITEMS = [
            {
                id: "init-1",
                name: "特賞：プレミアムギフトカード",
                count: 5,
                image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='gold'/><text x='50%' y='55%' font-size='14' font-weight='bold' text-anchor='middle' fill='white'>SPECIAL</text></svg>"
            },
            {
                id: "init-2",
                name: "A賞：こだわりのスイーツセット",
                count: 15,
                image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='coral'/><text x='50%' y='55%' font-size='16' font-weight='bold' text-anchor='middle' fill='white'>A AWARD</text></svg>"
            },
            {
                id: "init-3",
                name: "B賞：オリジナル限定ステッカー",
                count: 50,
                image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='deepskyblue'/><text x='50%' y='55%' font-size='16' font-weight='bold' text-anchor='middle' fill='white'>B AWARD</text></svg>"
            }
        ];

        // --- パスワード照合システム（「days」のハッシュ値） ---
        // 文字列「days」は、この単純ハッシュ関数で計算すると 3076183 になります。
        const TARGET_HASH = 3076183;
        function getHashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 32) - hash + str.charCodeAt(i);
                hash |= 0; // 32ビット整数に強制
            }
            return hash;
        }

        // アプリの状態データオブジェクト
        let state = {
            items: [],
            history: [],
            settings: {
                maxDraws: 3,
                winComment: "おめでとうございます！大当りです！"
            },
            design: {
                title: "豪華クジ引き大会",
                desc: "ボタンを押してクジを引こう！何が当たるかはお楽しみ。1日3回までチャレンジできます。",
                bgColor: "#f4f7f6",
                textColor: "#333333",
                btnColor: "#ff4757",
                bgImageUrl: ""
            },
            userDraws: {
                count: 0,
                lastDate: ""
            }
        };

        // アプリ起動時の初期化
        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromLocalStorage();
            checkMidnightReset();
            applyDesignStyles();
            renderMainScreen();
            
            // 重要: セッションに「ログイン済み」の印があれば、リロードされても管理画面を自動で開く
            if (sessionStorage.getItem('admin_logged_in') === 'true') {
                showAdminInterface();
                openAdminModal();
            }
        });

        // データのロード
        function loadStateFromLocalStorage() {
            // アイテム
            const savedItems = localStorage.getItem('kuji_items');
            if (savedItems) {
                state.items = JSON.parse(savedItems);
            } else {
                state.items = [...INITIAL_ITEMS];
                saveItemsToStorage();
            }

            // 履歴
            const savedHistory = localStorage.getItem('kuji_history');
            if (savedHistory) state.history = JSON.parse(savedHistory);

            // 設定
            const savedSettings = localStorage.getItem('kuji_settings');
            if (savedSettings) state.settings = JSON.parse(savedSettings);

            // デザイン
            const savedDesign = localStorage.getItem('kuji_design');
            if (savedDesign) state.design = JSON.parse(savedDesign);

            // ユーザー利用状況
            const savedUserDraws = localStorage.getItem('kuji_user_draws');
            if (savedUserDraws) state.userDraws = JSON.parse(savedUserDraws);
        }

        function saveItemsToStorage() { localStorage.setItem('kuji_items', JSON.stringify(state.items)); }
        function saveHistoryToStorage() { localStorage.setItem('kuji_history', JSON.stringify(state.history)); }
        function saveSettingsToStorage() { localStorage.setItem('kuji_settings', JSON.stringify(state.settings)); }
        function saveDesignToStorage() { localStorage.setItem('kuji_design', JSON.stringify(state.design)); }
        function saveUserDrawsToStorage() { localStorage.setItem('kuji_user_draws', JSON.stringify(state.userDraws)); }

        // 深夜0時の自動リセット判定
        function checkMidnightReset() {
            const todayStr = new Date().toLocaleDateString();
            if (state.userDraws.lastDate !== todayStr) {
                state.userDraws.count = 0;
                state.userDraws.lastDate = todayStr;
                saveUserDrawsToStorage();
            }
        }

        // デザインスタイルを反映する
        function applyDesignStyles() {
            document.getElementById('app-title').innerText = state.design.title;
            document.getElementById('app-desc').innerText = state.design.desc;

            const rootStyle = `
                :root {
                    --bg-color: ${state.design.bgColor || '#f4f7f6'};
                    --text-color: ${state.design.textColor || '#333333'};
                    --btn-color: ${state.design.btnColor || '#ff4757'};
                    --bg-image: ${state.design.bgImageUrl ? `url('${state.design.bgImageUrl}')` : 'none'};
                }
            `;
            document.getElementById('custom-theme-styles').innerHTML = rootStyle;
            
            if (state.design.customCss) {
                document.getElementById('admin-custom-css').innerHTML = state.design.customCss;
            }
        }

        // メイン画面のテキストやボタン状態描画
        function renderMainScreen() {
            checkMidnightReset();
            const remain = Math.max(0, state.settings.maxDraws - state.userDraws.count);
            document.getElementById('draw-count-status').innerText = `本日の残りクジ引き回数: ${remain} / ${state.settings.maxDraws} 回`;
            
            const btn = document.getElementById('draw-button');
            if (remain <= 0) {
                btn.disabled = true;
                btn.innerText = "本日は終了しました";
            } else {
                btn.disabled = false;
                btn.innerText = "クジを引く";
            }
        }

        // クジを引く実行ロジック
        function executeDraw() {
            checkMidnightReset();
            if (state.userDraws.count >= state.settings.maxDraws) {
                alert("本日の上限回数に達したため、これ以上クジは引けません。");
                return;
            }

            // 確率プールを構築 (個数を重みとした抽選)
            let pool = [];
            state.items.forEach(item => {
                const count = parseInt(item.count) || 0;
                for (let i = 0; i < count; i++) {
                    pool.push(item);
                }
            });

            if (pool.length === 0) {
                alert("現在、クジの中にアイテムが1つも入っていません。管理人に確認してください。");
                return;
            }

            // ランダム抽選
            const randomIndex = Math.floor(Math.random() * pool.length);
            const wonItem = pool[randomIndex];

            // 回数カウントアップ
            state.userDraws.count++;
            saveUserDrawsToStorage();
            renderMainScreen();

            // 履歴に保存
            const historyEntry = {
                id: 'hist-' + Date.now(),
                name: wonItem.name,
                image: wonItem.image,
                timestamp: new Date().toLocaleString()
            };
            state.history.unshift(historyEntry); // 先頭に追加
            saveHistoryToStorage();

            // 当選モーダルを開く
            document.getElementById('modal-win-comment').innerText = state.settings.winComment;
            document.getElementById('modal-win-name').innerText = wonItem.name;
            document.getElementById('modal-win-img').src = wonItem.image || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23ccc"/></svg>';
            
            openModal('win-modal');
        }

        // --- モーダル制御関係 ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openHistoryModal() {
            const container = document.getElementById('history-list-container');
            const emptyNotice = document.getElementById('history-empty');
            container.innerHTML = '';

            if (state.history.length === 0) {
                emptyNotice.style.display = 'block';
            } else {
                emptyNotice.style.display = 'none';
                state.history.forEach(hist => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.innerHTML = `
                        <img class="history-thumb" src="${hist.image || ''}" alt="アイテム">
                        <div class="history-info">
                            <div class="history-name">${hist.name}</div>
                            <div class="history-time">${hist.timestamp}</div>
                        </div>
                    `;
                    container.appendChild(li);
                });
            }
            openModal('history-modal');
        }

        function openAdminModal() {
            // パスワード入力欄を空にする
            document.getElementById('admin-password-input').value = '';
            document.getElementById('login-error').innerText = '';
            openModal('admin-modal');
        }

        // --- 管理画面ログインロジック ---
        function checkAdminPassword() {
            const inputField = document.getElementById('admin-password-input');
            const password = inputField.value;
            
            if (getHashCode(password) === TARGET_HASH) {
                // 認証成功: セッションストレージに保存
                sessionStorage.setItem('admin_logged_in', 'true');
                showAdminInterface();
            } else {
                document.getElementById('login-error').innerText = "パスワードが正しくありません。";
            }
        }

        function showAdminInterface() {
            document.getElementById('admin-login-area').style.display = 'none';
            document.getElementById('admin-main-area').style.display = 'block';
            
            // フォームの値を現在の状態で初期化
            document.getElementById('setting-max-draws').value = state.settings.maxDraws;
            document.getElementById('setting-win-comment').value = state.settings.winComment;
            
            document.getElementById('design-title-text').value = state.design.title;
            document.getElementById('design-desc-text').value = state.design.desc;
            document.getElementById('design-bg-color').value = state.design.bgColor || '#f4f7f6';
            document.getElementById('design-text-color').value = state.design.textColor || '#333333';
            document.getElementById('design-btn-color').value = state.design.btnColor || '#ff4757';
            document.getElementById('design-bg-image-url').value = state.design.bgImageUrl || '';
            document.getElementById('design-custom-css').value = state.design.customCss || '';

            renderAdminItems();
        }

        function adminLogout() {
            sessionStorage.removeItem('admin_logged_in');
            document.getElementById('admin-login-area').style.display = 'block';
            document.getElementById('admin-main-area').style.display = 'none';
        }

        function switchAdminTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // --- 管理画面：アイテム編集ロジック ---
        function renderAdminItems() {
            const container = document.getElementById('admin-items-container');
            container.innerHTML = '';

            state.items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <img class="item-thumb" src="${item.image || ''}">
                    <div style="flex:1;">
                        <input type="text" value="${item.name}" onchange="updateItemName(${index}, this.value)" style="width:70%; padding:4px; font-size:13px; margin-bottom:3px;">
                        <div style="font-size:12px; color:#666;">
                            個数: <input type="number" min="1" max="100" value="${item.count}" onchange="updateItemCount(${index}, this.value)" style="width:50px; padding:2px;">
                        </div>
                    </div>
                    <button class="btn-sm btn-danger" onclick="deleteItem(${index})">削除</button>
                `;
                container.appendChild(row);
            });
        }

        function addNewItem() {
            const name = document.getElementById('new-item-name').value.trim();
            const count = parseInt(document.getElementById('new-item-count').value) || 1;
            const fileInput = document.getElementById('new-item-file');

            if (!name) {
                alert("アイテム名を入力してください。");
                return;
            }

            const addItem = (imgData) => {
                state.items.push({
                    id: 'item-' + Date.now(),
                    name: name,
                    count: Math.min(100, Math.max(1, count)),
                    image: imgData || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23eee"/><text x="50%" y="55%" text-anchor="middle" fill="%23aaa">No Img</text></svg>'
                });
                saveItemsToStorage();
                renderAdminItems();

                // フォームクリア
                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-count').value = '10';
                fileInput.value = '';
                alert("アイテムを追加しました。");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    addItem(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                addItem(null);
            }
        }

        function updateItemName(index, newName) {
            if (!newName.trim()) return;
            state.items[index].name = newName.trim();
            saveItemsToStorage();
        }

        function updateItemCount(index, newCount) {
            let val = parseInt(newCount) || 1;
            val = Math.min(100, Math.max(1, val));
            state.items[index].count = val;
            saveItemsToStorage();
        }

        function deleteItem(index) {
            if (confirm("このアイテムを削除してもよろしいですか？")) {
                state.items.splice(index, 1);
                saveItemsToStorage();
                renderAdminItems();
            }
        }

        // --- 管理画面：その他の設定変更 ---
        function saveSettings() {
            const maxDraws = parseInt(document.getElementById('setting-max-draws').value) || 3;
            const winComment = document.getElementById('setting-win-comment').value.trim();

            state.settings.maxDraws = maxDraws;
            state.settings.winComment = winComment || "おめでとうございます！";
            
            saveSettingsToStorage();
            renderMainScreen();
            alert("基本設定を保存しました。");
        }

        function resetAllUsersDrawCount() {
            if (confirm("全てのユーザーの本日プレイ回数をリセットしてよろしいですか？")) {
                state.userDraws.count = 0;
                saveUserDrawsToStorage();
                renderMainScreen();
                alert("回数をリセットしました。");
            }
        }

        function saveDesignSettings() {
            state.design.title = document.getElementById('design-title-text').value;
            state.design.desc = document.getElementById('design-desc-text').value;
            state.design.bgColor = document.getElementById('design-bg-color').value;
            state.design.textColor = document.getElementById('design-text-color').value;
            state.design.btnColor = document.getElementById('design-btn-color').value;
            state.design.bgImageUrl = document.getElementById('design-bg-image-url').value.trim();
            state.design.customCss = document.getElementById('design-custom-css').value;

            saveDesignToStorage();
            applyDesignStyles();
            alert("デザイン設定を適用・保存しました。");
        }
    </script>
</body>
</html>
